name: NoorNote
summary: A feature-rich Nostr client for GrapheneOS/Android, Web and Desktop (Linux & macOS)
description: |
  NoorNote is a free, open-source Nostr client built for the desktop and mobile.
  Browse your timeline, write and discover long-form articles, manage follows,
  bookmarks and mute lists, send zaps, and handle your keys securely.
  No Google Services required.

