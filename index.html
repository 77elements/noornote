<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="NoorNote - feature-rich, fast, secure Nostr client." />
  <meta name="theme-color" content="#0f0d23" />

  <!-- Prevent caching of index.html to always load latest asset hashes -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <!-- Favicon and icons -->
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/favicon.png" />
  <link rel="manifest" href="/manifest.json" />

  <title>NoorNote - feature-rich, fast, secure Nostr client</title>

  <!-- Inline styles for loading screen (shown before JS/CSS bundle loads) -->
  <style>
    @font-face {
      font-family: 'Saira';
      src: url('/fonts/Saira/Saira-Bold.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    @keyframes pulsate {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    body {
      margin: 0;
      background-color: #0f0d23;
      font-family: sans-serif;
    }

    .loading-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }

    .loading-logo {
      margin: 0;
    }

    .nn-logo {
      display: inline-block;
      font-family: 'Saira', sans-serif;
      font-size: 4rem;
      font-weight: 700;
      line-height: 1.2;
      background: linear-gradient(135deg, #b45fd9, #5ef75e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .loading-text {
      font-size: 1.25rem;
      color: #ede2da;
      margin-top: 1rem;
      animation: pulsate 2.5s ease-in-out infinite;
    }
  </style>
</head>
<body>
  <!-- SVG Sprite Sheet — loaded once, icons referenced via <svg><use href="#icon-name"/></svg> -->
  <script>fetch('./icons.svg').then(r=>r.text()).then(t=>{const d=document.createElement('div');d.innerHTML=t;document.body.insertBefore(d.firstElementChild,document.body.firstChild)})</script>

  <div id="app">
    <!-- App loading state -->
    <div id="loading" class="loading-screen">
      <h1 class="loading-logo"><span class="nn-logo">NoorNote</span></h1>
      <p class="loading-text">Loading...</p>
    </div>
  </div>

  <!-- Main application script -->
  <script type="module" src="/src/main.ts"></script>

  <!-- No-JS fallback -->
  <noscript>
    <div class="no-js-message">
      <h2>JavaScript Required</h2>
      <p>Noornote requires JavaScript to function. Please enable JavaScript in your browser.</p>
    </div>
  </noscript>
</body>
</html>
