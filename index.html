<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!-- desc-sync:meta-main -->
  <meta name="description" content="NoorNote — a slim yet feature rich Nostr client for Web, Desktop and Android. No Google services, open source. Social, personal websites, marketplace, Zap Streams and more." />
  <!-- /desc-sync:meta-main -->
  <meta name="theme-color" content="#0f0d23" />

  <!-- Prevent caching of index.html to always load latest asset hashes -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <!-- Favicon and icons -->
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/favicon.png" />
  <link rel="manifest" href="/manifest.json" />

  <title>NoorNote - feature-rich, fast, secure Nostr client</title>

  <!-- Inline styles for loading screen (shown before JS/CSS bundle loads) -->
  <style>
    @font-face {
      font-family: 'Saira';
      src: url('/fonts/Saira/Saira-Bold.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    @keyframes pulsate {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    body {
      margin: 0;
      background-color: #0f0d23;
      font-family: sans-serif;
    }

    .loading-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }

    .loading-logo {
      margin: 0;
    }

    /* The N-mark (v1 wheel logo): sized to the old 4rem gradient
       wordmark's visual height (the glyph fills ~half the 642 viewBox,
       hence 6rem), tinted in the interactive accent color — theme-aware
       via the boot script below (fallback = default theme Noor Jadid). */
    .loading-logo svg {
      width: 6rem;
      height: 6rem;
      color: var(--nn-boot-color-4, #e33796);
    }

    .loading-text {
      font-size: 1.25rem;
      color: #ede2da;
      margin-top: 1rem;
      animation: pulsate 2.5s ease-in-out infinite;
    }
  </style>
  <script>
    // Boot tint: the loading screen reacts to the selected theme before
    // the bundle has loaded — the theme's --color-4 is mirrored here
    // (source: src/styles/abstracts/_themes.scss). Fallback = the
    // default theme (Noor Jadid); storage failure keeps the fallback.
    try {
      var BOOT_COLOR_4 = {
        'noor-jadid': '#e33796',
        'default': '#dc85ad',
        'bright-superman': '#2563eb',
        'code-bunker': '#9cdcfe',
        'soft-lilac': '#c2447e',
        't-low': '#8757ad',
        'dark-symbiote': '#b13d4c',
        'neon-harley': '#ed3a96',
        'wake-up-neo': '#00ff41'
      };
      var bootTheme = localStorage.getItem('noornote_theme');
      document.documentElement.style.setProperty(
        '--nn-boot-color-4',
        BOOT_COLOR_4[bootTheme] || BOOT_COLOR_4['noor-jadid']
      );
    } catch (e) { /* storage unavailable — the CSS fallback applies */ }
  </script>
</head>
<body>
  <!-- Boot-only logo symbol: the JS sprite (#nn-logo) injects later, so
  the pre-JS loading screen carries its own copy under a separate id. -->
  <svg xmlns="http://www.w3.org/2000/svg" style="display: none" aria-hidden="true">
    <symbol id="nn-logo-boot" viewBox="0 0 642 642">
    <path d="M125.0 174.5 124.5 223.0 156.5 224.0 156.5 497.0 225.5 497.0 226.0 284.5 366.5 495.0 369.0 497.5 418.0 497.5 224.0 174.5 124.5 175.0 124.5 223.0 156.5 224.0 156.5 497.0 225.5 497.0 226.0 284.5 366.5 495.0 369.0 497.5 418.5 497.0 224.5 175.0Z M262.0 174.5 266.5 185.0 455.5 496.0 457.0 497.5 502.0 497.5 502.5 175.0 400.5 175.0 409.0 180.5 423.5 198.0 430.5 211.0 435.5 229.0 436.0 358.5 312.5 175.0 261.5 175.0 457.0 497.5 502.5 497.0 502.5 175.0 400.5 175.0 409.0 180.5 423.5 198.0 430.5 211.0 435.5 229.0 436.0 358.5 312.5 175.0Z" fill="currentColor" fill-rule="nonzero" />
  </symbol>
  </svg>
  <!-- SVG Sprite Sheet — icons defined once, referenced via <svg><use href="#icon-name"/></svg> -->
  <div id="app">
    <!-- App loading state -->
    <div id="loading" class="loading-screen">
      <h1 class="loading-logo">
        <svg class="nn-wheel__logo" aria-hidden="true"><use href="#nn-logo-boot"/></svg>
      </h1>
      <p class="loading-text">Loading...</p>
    </div>
  </div>

  <!-- Main application script -->
  <script type="module" src="/src/main.ts"></script>

  <!-- No-JS fallback -->
  <noscript>
    <div class="no-js-message">
      <h2>JavaScript Required</h2>
      <p>Noornote requires JavaScript to function. Please enable JavaScript in your browser.</p>
    </div>
  </noscript>
</body>
</html>
